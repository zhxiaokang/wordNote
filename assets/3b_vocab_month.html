<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px">
<title>3 词汇-month</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:390px; background:#F2F6FB;
  font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',
              'Source Han Sans CN',sans-serif;
}
.screen {
  width:390px; min-height:844px; position:relative;
  padding-bottom:88px; background:#F2F6FB;
}
.status {
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 22px 4px; font-size:13px; font-weight:700; color:#1C1C1E;
}
.page-title { padding:4px 24px 0; }
.page-title h1 { font-size:24px; font-weight:700; color:#1C1C1E; line-height:1.2; }
.page-title p  { font-size:13px; color:#8E8E93; margin-top:2px; }
.nav {
  position:fixed; bottom:0; left:0; width:390px; height:88px;
  background:#fff; border-top:0.5px solid #C7C7CC;
  display:flex; align-items:center; justify-content:space-around;
  z-index:100;
}
.nav-item {
  display:flex; flex-direction:column; align-items:center;
  gap:4px; color:#8E8E93; font-size:12px; cursor:pointer; width:80px;
}
.nav-item.active { color:#3A9FD5; }
.nav-item .icon-wrap {
  background:transparent; border-radius:14px;
  padding:4px 18px; font-size:18px; line-height:1.4;
}
.nav-item.active .icon-wrap { background:#E8F4FC; }
.tabs {
  margin:10px 24px 0; background:#F2F2F7; border-radius:12px;
  display:flex; padding:2px;
}
.tab {
  flex:1; text-align:center; padding:7px 0; border-radius:10px;
  font-size:15px; color:#8E8E93; cursor:pointer;
}
.tab.active {
  background:#fff; color:#3A9FD5; font-weight:700;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.group-hdr {
  background:#fff; border-radius:12px;
  box-shadow:0 1px 8px rgba(0,0,0,.06);
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px; margin:12px 24px 0;
}
/* right-pointing triangle for collapsed */
.tri-right {
  width:0; height:0;
  border-top:7px solid transparent;
  border-bottom:7px solid transparent;
  border-left:12px solid #3A9FD5;
  margin-right:10px; flex-shrink:0;
}
/* down-pointing triangle for expanded */
.tri-down {
  width:0; height:0;
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-top:12px solid #3A9FD5;
  margin-right:10px; flex-shrink:0;
}
.word-row {
  background:#fff; border-radius:10px;
  border:0.5px solid #C7C7CC;
  padding:7px 14px;
  display:flex; justify-content:space-between; align-items:center;
  margin:4px 24px 0;
}
</style>
</head>
<body>
<div class="screen">
<div class="status"><span>9:41</span><span>● ● ●</span></div>
<div class="page-title"><h1>词汇</h1><p>我的单词本</p></div>
<div class="tabs">
  <div class="tab ">周</div>
  <div class="tab active">月</div>
  <div class="tab ">年</div>
</div>
<div class="group-hdr">
  <div class="tri-down"></div>
  <span style="font-size:13px;color:#1C1C1E;flex:1">2026年8月</span>
  <span style="background:#E8F4FC;color:#3A9FD5;font-size:13px;font-weight:700;border-radius:8px;padding:2px 10px">3</span>
</div>
<div class="word-row">
  <div>
    <div style="font-size:13px;font-weight:700;color:#1C1C1E">serendipity</div>
    <div style="font-size:11px;margin-top:2px">
      <span style="color:#3A9FD5;font-weight:700">n.</span>
      <span style="color:#8E8E93;margin-left:4px">意外发现美好事物的运气</span>
    </div>
  </div>
  <span style="font-size:18px;color:#C7C7CC">›</span>
</div>
<div class="word-row">
  <div>
    <div style="font-size:13px;font-weight:700;color:#1C1C1E">ambiguous</div>
    <div style="font-size:11px;margin-top:2px">
      <span style="color:#3A9FD5;font-weight:700">adj.</span>
      <span style="color:#8E8E93;margin-left:4px">模棱两可的；有歧义的</span>
    </div>
  </div>
  <span style="font-size:18px;color:#C7C7CC">›</span>
</div>
<div class="word-row">
  <div>
    <div style="font-size:13px;font-weight:700;color:#1C1C1E">lucid</div>
    <div style="font-size:11px;margin-top:2px">
      <span style="color:#3A9FD5;font-weight:700">adj.</span>
      <span style="color:#8E8E93;margin-left:4px">清晰的；明了的</span>
    </div>
  </div>
  <span style="font-size:18px;color:#C7C7CC">›</span>
</div>
<div class="group-hdr">
  <div class="tri-right"></div>
  <span style="font-size:13px;color:#1C1C1E;flex:1">2026年7月</span>
  <span style="background:#E8F4FC;color:#3A9FD5;font-size:13px;font-weight:700;border-radius:8px;padding:2px 10px">12</span>
</div>
<div class="group-hdr">
  <div class="tri-right"></div>
  <span style="font-size:13px;color:#1C1C1E;flex:1">2026年6月</span>
  <span style="background:#E8F4FC;color:#3A9FD5;font-size:13px;font-weight:700;border-radius:8px;padding:2px 10px">9</span>
</div>
<div class="group-hdr">
  <div class="tri-right"></div>
  <span style="font-size:13px;color:#1C1C1E;flex:1">2025年12月</span>
  <span style="background:#E8F4FC;color:#3A9FD5;font-size:13px;font-weight:700;border-radius:8px;padding:2px 10px">7</span>
</div>
<div class="nav">
  <div class="nav-item"><div class="icon-wrap"><span>↺</span></div><span>复习</span></div>
  <div class="nav-item"><div class="icon-wrap"><span>＋</span></div><span>新词</span></div>
  <div class="nav-item active"><div class="icon-wrap"><span>≡</span></div><span>词汇</span></div>
</div>
</div>
</body>
</html>
