<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px">
<title>4 我的-反馈</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:390px; background:#F2F6FB;
  font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',
              'Source Han Sans CN',sans-serif;
}
.screen {
  width:390px; min-height:844px; position:relative;
  padding-bottom:88px; background:#F2F6FB;
}
.status {
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 22px 4px; font-size:13px; font-weight:700; color:#1C1C1E;
}
.page-title { padding:4px 24px 0; display:flex; align-items:center; justify-content:space-between; }
.page-title h1 { font-size:24px; font-weight:700; color:#1C1C1E; line-height:1.2; }
.nav {
  position:fixed; bottom:0; left:0; width:390px; height:88px;
  background:#fff; border-top:0.5px solid #C7C7CC;
  display:flex; align-items:center; justify-content:space-around;
  z-index:100;
}
.nav-item {
  display:flex; flex-direction:column; align-items:center;
  gap:4px; color:#8E8E93; font-size:12px; cursor:pointer; width:80px;
}
.nav-item.active { color:#3A9FD5; }
.nav-item .icon-wrap {
  background:transparent; border-radius:14px;
  padding:4px 18px; font-size:18px; line-height:1.4;
}
.nav-item.active .icon-wrap { background:#E8F4FC; }
.card {
  background:#fff; border-radius:18px;
  box-shadow:0 2px 14px rgba(0,0,0,.08);
  margin:14px 24px 0; padding:18px 18px;
}
.card-title {
  font-size:15px; font-weight:700; color:#1C1C1E; margin-bottom:12px;
}
.btn {
  border:none; border-radius:14px; font-size:15px;
  font-family:inherit; cursor:pointer; font-weight:600;
  padding:11px 22px;
}
.btn-blue  { background:#3A9FD5; color:#fff; }
.btn-ghost { background:#F2F2F7; color:#3A9FD5; }
.btn-red   { background:#FFF0F0; color:#FF3B30; }
</style>
</head>
<body>
<div class="screen">
<div class="status"><span>9:41</span><span>● ● ●</span></div>

<div style="display:flex;align-items:center;padding:14px 24px 0;gap:8px">
  <span style="font-size:20px;color:#3A9FD5">‹</span>
  <h1 style="font-size:20px;font-weight:700;color:#1C1C1E">用户反馈</h1>
</div>

<!-- past thread -->
<div class="card" style="margin-top:14px">
  <div style="font-size:12px;color:#8E8E93;margin-bottom:8px">我的留言</div>
  <div style="background:#E8F4FC;border-radius:12px;padding:10px 14px;font-size:13px;color:#1C1C1E;line-height:1.6">
    希望可以支持导出单词本为 CSV 格式，方便备份。
  </div>
  <div style="font-size:11px;color:#C7C7CC;margin-top:4px;text-align:right">2026/08/05 10:23</div>

  <div style="font-size:12px;color:#8E8E93;margin-top:12px;margin-bottom:8px">开发者回复</div>
  <div style="background:#F2F2F7;border-radius:12px;padding:10px 14px;font-size:13px;color:#1C1C1E;line-height:1.6">
    感谢建议！导出功能已列入开发计划，预计下个版本上线 🙌
  </div>
  <div style="font-size:11px;color:#C7C7CC;margin-top:4px;text-align:right">2026/08/06 14:07</div>
</div>

<!-- new message box -->
<div class="card" style="margin-top:14px">
  <div style="font-size:12px;color:#8E8E93;margin-bottom:8px">新建留言</div>
  <textarea style="width:100%;border:0.5px solid #C7C7CC;border-radius:12px;
                   padding:12px 14px;font-size:14px;font-family:inherit;
                   color:#1C1C1E;resize:none;height:90px;outline:none;background:#F2F2F7"
            placeholder="请输入你的建议或问题…"></textarea>
  <button class="btn btn-blue" style="margin-top:10px;width:100%;padding:12px 0">提交</button>
</div>

<div class="nav">
  <div class="nav-item"><div class="icon-wrap"><span>↺</span></div><span>复习</span></div>
  <div class="nav-item"><div class="icon-wrap"><span>＋</span></div><span>新词</span></div>
  <div class="nav-item"><div class="icon-wrap"><span>≡</span></div><span>词汇</span></div>
  <div class="nav-item active"><div class="icon-wrap"><span>👤</span></div><span>我的</span></div>
</div>
</div>
</body>
</html>
